<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do Apoio | Projeto Senac</title>
<style>
:root {
  --paper:#FAF2EA;
  --ink:#251232;
  --muted:#654D76;
  --back:#EBDEEF;
  --primaryTop:#43164B;
  --primaryBottom:#2B1036;
  --onPrimary:#FFF5ED;
  --offlineFill:#FBE3D4;
  --offlineIcon:#A75D00;
  --connectedFill:#E1EEDB;
  --connectedIcon:#237547;
  --progressFill:#EEE4F3;
  --progressTrack:#C9B4D1;
  --progressIcon:#634171;
  --mascotShadow:#EEE0E1;
  color-scheme: light;
  color: var(--ink);
  background: var(--paper);
  font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 455px; margin: auto; padding: 24px 20px; }
.back { display: inline-block; margin-bottom: 16px; color: var(--accent); font-weight: 700; }
h1,h2,p { margin: 0; }
h1 { font-size: 33px; letter-spacing: -.05em; }
h2 { font-size: 22px; line-height: 1.15; letter-spacing: -.025em; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
output {
  --status-icon: var(--offlineIcon);
  display: inline-flex; align-items: center; gap: 6px; background: var(--offlineFill);
  border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 700;
}
output::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--status-icon); }
output.ready { --status-icon: var(--connectedIcon); background: var(--connectedFill); }
section { margin-top: 16px; }
.card { background: var(--progressFill); border-radius: 12px; padding: 16px; }
.hint { margin-top: 6px; font-size: 14px; color: var(--muted); }
button {
  min-height: 44px; margin-top: 10px; padding: 9px 13px; border: 0; border-radius: 10px;
  color: var(--onPrimary); background: linear-gradient(var(--primaryTop), var(--primaryBottom));
  font: inherit; font-weight: 700; cursor: pointer;
}
button.secondary { color: var(--ink); background: var(--back); }
button:disabled { opacity: .56; cursor: default; }
:focus-visible { outline: 3px solid var(--progressIcon); outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <a class="back" href="/">← Projeto Senac</a>
  <header><h1>Apoio</h1><output id="connection" aria-live="polite">Sem conexão</output></header>
  <section aria-label="Conexão com o aparelho">
    <p class="hint" id="help">Conecte o painel ao aparelho.</p>
    <button id="ble" type="button">Conectar por Bluetooth</button>
  </section>
  <section id="activity" class="card" hidden role="status">
    <h2 id="activity-title">Aguardando um pedido</h2>
    <p class="hint" id="activity-detail">O envio começa quando você confirma na tela do Apoio.</p>
  </section>
  <section id="location" class="card" hidden aria-labelledby="location-title">
    <h2 id="location-title">Localização do celular</h2>
    <p class="hint" id="location-note" role="status">Permita o acesso para anexar a posição aos pedidos que confirmar.</p>
    <button id="locate" type="button" class="secondary" aria-pressed="false">Incluir localização</button>
  </section>
</main>
<script>
"use strict";
const scenarios = [{"key":"ansiedade","title":"Ansiedade ou pânico","text":"Estou com muita ansiedade e preciso de apoio. Você pode falar comigo agora?"},{"key":"roubo","title":"Celular roubado","text":"Meu celular foi roubado. Preciso de ajuda. Pode avisar alguém de confiança e me ajudar a chegar a um lugar seguro?"},{"key":"risco","title":"Estou em risco","text":"Não me sinto em segurança. Preciso de ajuda agora. Pode avisar alguém de confiança?"},{"key":"conversa","title":"Preciso conversar","text":"Preciso conversar com alguém. Você pode me mandar uma mensagem quando puder?"},{"key":"urgente","title":"Mensagem pronta","text":"Preciso de ajuda agora. Pode tentar falar comigo ou avisar alguém de confiança?"}];
const $ = id => document.getElementById(id);
const service = "24ee4220-5c42-4c90-a322-ec12904c6761";
const statusUuid = "24ee4223-5c42-4c90-a322-ec12904c6761";
const commandUuid = "24ee4224-5c42-4c90-a322-ec12904c6761";
const gpsUuid = "24ee4225-5c42-4c90-a322-ec12904c6761";
const wifi = location.hostname === "192.168.4.1";
const relay = wifi ? "https://apoio-senac.vercel.app/api/envio" : "/api/envio";
const canLocate = isSecureContext && Boolean(navigator.geolocation && navigator.permissions);
const locationPreference = "sos.location.v1";
let locationEnabled = false;
try { locationEnabled = localStorage.getItem(locationPreference) === "yes"; } catch {}
let providerReady = false, nextHealthCheck = 0;
let bleTimer, bleDevice, commands, status, gps, previous;
let busy = false;

function connection(text, detail, ready = false) {
  if ($("connection").textContent !== text) $("connection").textContent = text;
  if ($("help").textContent !== detail) $("help").textContent = detail;
  $("connection").classList.toggle("ready", ready);
}
function activity(title, detail) {
  $("activity").hidden = false;
  $("activity-title").textContent = title;
  $("activity-detail").textContent = detail;
}
function connected(channel, configured) {
  if (!configured) {
    connection("Configuração pendente", "A versão do Apoio precisa da chave de envio deste projeto.");
    return;
  }
  if (!providerReady) {
    connection("Envio indisponível", channel + " conectado. Confira a internet e a configuração do WhatsApp.");
    return;
  }
  connection("Conectado", "Via " + channel + ". Mantenha este painel aberto.", true);
  if ($("activity").hidden) activity("Aguardando um pedido", "O envio começa quando você confirma na tela do Apoio.");
}
async function checkProvider() {
  if (Date.now() < nextHealthCheck) return;
  try {
    const response = await fetch(relay, {cache: "no-store", signal: AbortSignal.timeout(2600)});
    providerReady = response.ok && (await response.json()).ready === true;
  } catch { providerReady = false; }
  nextHealthCheck = Date.now() + 9000;
}

function updateLocation() {
  $("locate").setAttribute("aria-pressed", String(locationEnabled));
  $("locate").textContent = locationEnabled ? "Desativar localização" : "Incluir localização";
  $("location-note").textContent = locationEnabled ? "A posição é consultada na hora do pedido." :
    "Permita o acesso para anexar a posição aos pedidos que confirmar.";
}
function currentPosition() {
  return new Promise(resolve => {
    const timer = setTimeout(() => resolve(null), 2700);
    const finish = result => { clearTimeout(timer); resolve(result); };
    navigator.geolocation.getCurrentPosition(({coords, timestamp}) => {
      const {latitude, longitude} = coords;
      const fresh = Date.now() - timestamp <= 15000;
      finish(fresh && Number.isFinite(latitude) && Number.isFinite(longitude) ? {latitude, longitude} : null);
    }, () => finish(null), {maximumAge: 0, timeout: 2500, enableHighAccuracy: true});
  });
}
async function locateForRequest() {
  if (!canLocate || !locationEnabled) return null;
  try {
    const permission = await navigator.permissions.query({name: "geolocation"});
    if (permission.state === "granted") return await currentPosition();
  } catch {}
  return null;
}
$("location").hidden = !canLocate;
updateLocation();
$("locate").addEventListener("click", async () => {
  $("locate").disabled = true;
  try {
    if (locationEnabled) locationEnabled = false;
    else {
      // Request permission in setup, never during a help request.
      await new Promise(resolve => navigator.geolocation.getCurrentPosition(resolve, resolve, {timeout: 3500}));
      locationEnabled = (await navigator.permissions.query({name: "geolocation"})).state === "granted";
    }
    try { localStorage.setItem(locationPreference, locationEnabled ? "yes" : "no"); } catch {}
    updateLocation();
  } catch {
    $("location-note").textContent = "O navegador não liberou a localização.";
  } finally {
    $("locate").disabled = false;
  }
});

function hex(bytes) {
  return Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
}
function setOutcome(result, title) {
  if (result.outcome === 16 || result.outcome === 19) {
    activity("Pedido enviado", title + ". O WhatsApp aceitou o envio.");
  } else if (result.outcome === 17) {
    activity("Pedido não enviado", "O WhatsApp recusou o envio.");
  } else activity("Envio sem confirmação", "Consulte o status na tela do Apoio.");
}
function signedResult(result) {
  return result && [16, 17, 18, 19].includes(result.outcome) &&
    typeof result.receipt === "string" && /^[0-9a-f]{30}$/.test(result.receipt);
}
async function dispatch(body) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const response = await fetch(relay, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body,
        signal: AbortSignal.timeout(attempt ? 4200 : 12300),
      });
      if (!response.ok) break;
      const result = await response.json();
      if (signedResult(result)) return result;
      if (result.status !== "pending") break;
    } catch {}
    if (!attempt) await new Promise(resolve => setTimeout(resolve, 700));
  }
  return {outcome: 18, receipt: ""};
}
async function receive(packet, report) {
  const {id, kind, proof, gps: position} = packet;
  if (!id || !scenarios[kind - 1] || kind === 2 || !/^[0-9a-f]{32}$/.test(proof) ||
      document.visibilityState !== "visible") return;
  const title = scenarios[kind - 1].title;
  if (!previous || previous.proof !== proof) {
    previous = {proof, result: null, reported: false};
  }
  if (previous.result?.outcome === 18 && previous.reported) previous.result = null;
  if (!previous.result) {
    activity("Enviando pedido", title);
    const phonePosition = await locateForRequest();
    previous.result = await dispatch(JSON.stringify({id, kind, proof, gps: position, phonePosition}));
  }
  setOutcome(previous.result, title);
  await report(id, previous.result);
  previous.reported = true;
}
async function pollWifi() {
  const response = await fetch("/api/state?ready=" + Number(providerReady), {
    cache: "no-store", signal: AbortSignal.timeout(2400),
  });
  if (!response.ok) throw new Error("Wi-Fi indisponível");
  const packet = await response.json();
  connected("Wi-Fi", packet.id || packet.configured);
  await receive(packet, async (id, {outcome, receipt}) => {
    const ack = await fetch("/api/result?id=" + id + "&outcome=" + outcome + "&receipt=" + receipt, {
      method: "POST", signal: AbortSignal.timeout(2400),
    });
    if (!ack.ok) throw new Error("A CYD não recebeu o resultado");
  });
}
async function pollBluetooth() {
  const command = commands;
  await command.writeValueWithResponse(Uint8Array.of(0, Number(providerReady)));
  const data = await status.readValue();
  if (data.byteLength !== 21) throw new Error("Firmware incompatível");
  const id = data.getUint32(0, true);
  connected("Bluetooth", id || data.getUint8(4) === 1);
  if (!id) return;
  const proof = hex(new Uint8Array(data.buffer, data.byteOffset + 5, 16));
  const position = await gps.readValue();
  const reading = position.byteLength === 12 && position.getUint32(0, true) === id ? {
    latitude: position.getInt32(4, true) / 1000000,
    longitude: position.getInt32(8, true) / 1000000,
  } : null;
  await receive({id, kind: data.getUint8(4), proof, gps: reading}, async (receivedId, {outcome, receipt}) => {
    const tag = receipt.match(/../g) || [];
    const data = new DataView(new ArrayBuffer(5 + tag.length));
    data.setUint8(0, outcome);
    data.setUint32(1, receivedId, true);
    tag.forEach((byte, index) => data.setUint8(5 + index, parseInt(byte, 16)));
    await command.writeValueWithResponse(data.buffer);
  });
}
async function sync() {
  if (busy || (!wifi && !commands) || document.visibilityState !== "visible") return;
  busy = true;
  try {
    await checkProvider();
    if (document.visibilityState !== "visible") return;
    if (wifi) await pollWifi();
    else if (commands) await pollBluetooth();
  } catch {
    connection("Sem conexão", "Confira a conexão com o aparelho.");
  } finally { busy = false; }
}
if (wifi) {
  $("ble").hidden = true;
  sync();
  setInterval(sync, 700);
} else if (navigator.bluetooth && isSecureContext) {
  $("help").textContent = "Escolha Projeto Senac ao conectar por Bluetooth.";
  $("ble").addEventListener("click", async () => {
    if (bleDevice?.gatt.connected) { bleDevice.gatt.disconnect(); return; }
    $("ble").disabled = true;
    connection("Conectando", "Selecione Projeto Senac na lista.");
    let incompatible = false;
    try {
      bleDevice = await navigator.bluetooth.requestDevice({filters: [{services: [service]}]});
      bleDevice.addEventListener("gattserverdisconnected", () => {
        clearInterval(bleTimer);
        commands = status = gps = null;
        $("ble").textContent = "Conectar por Bluetooth";
        if (!incompatible) connection("Sem conexão", "Reconecte para receber novos pedidos.");
      }, {once: true});
      const gatt = await bleDevice.gatt.connect();
      const profile = await gatt.getPrimaryService(service);
      try {
        status = await profile.getCharacteristic(statusUuid);
        gps = await profile.getCharacteristic(gpsUuid);
        commands = await profile.getCharacteristic(commandUuid);
      } catch { incompatible = true; throw new Error("Firmware incompatível"); }
      nextHealthCheck = 0;
      await sync();
      $("ble").textContent = "Desconectar Bluetooth";
      bleTimer = setInterval(sync, 950);
    } catch {
      if (bleDevice?.gatt.connected) bleDevice.gatt.disconnect();
      connection(incompatible ? "Atualize a CYD" : "Sem conexão", incompatible ?
        "Grave a versão do Apoio com envio automático no aparelho." : "Confira o Bluetooth e tente novamente.");
    } finally { $("ble").disabled = false; }
  });
} else {
  $("ble").hidden = true;
  $("help").textContent = "Use o Chrome com Bluetooth ou conecte à rede Apoio e abra http://192.168.4.1.";
}
document.addEventListener("visibilitychange", sync);
</script>
</body>
</html>
