<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apoio no celular</title>
<style>
:root {
  --paper:#FAF2EA;
  --ink:#251232;
  --muted:#654D76;
  --back:#EBDEEF;
  --primaryTop:#43164B;
  --primaryBottom:#2B1036;
  --onPrimary:#FFF5ED;
  --offlineFill:#FBE3D4;
  --offlineIcon:#A75D00;
  --connectedFill:#E1EEDB;
  --connectedIcon:#237547;
  --progressFill:#EEE4F3;
  --progressTrack:#C9B4D1;
  --progressIcon:#634171;
  --mascotShadow:#EEE0E1;
  color-scheme: light;
  color: var(--ink);
  background: var(--paper);
  font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; }
main { max-width: 455px; margin: auto; padding: 24px 20px; }
h1,h2,h3,p { margin: 0; }
h1 { font-size: 33px; letter-spacing: -.05em; }
h2 { line-height: 1.15; font-size: 24px; letter-spacing: -.035em; }
header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
output {
  --status-icon: var(--offlineIcon);
  display: inline-flex; align-items: center; gap: 6px; background: var(--offlineFill);
  border-radius: 999px; padding: 5px 10px; font-size: 13px; font-weight: 700; white-space: nowrap;
}
output::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--status-icon); }
output.ready { --status-icon: var(--connectedIcon); background: var(--connectedFill); }
output.pending::before {
  width: 10px; height: 10px; background: transparent; border: 2px solid var(--progressTrack);
  border-top-color: var(--progressIcon); animation: rotate 900ms steps(4) infinite;
}
@keyframes rotate { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { output.pending::before { animation: none; } }
section, details { margin-top: 16px; }
article, #waiting, details { background: var(--progressFill); border-radius: 12px; padding: 16px; }
article .request-context { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin: 10px 0 16px; }
.request-context h3 { font-size: 16px; }
.request-context > * { max-width: 100%; overflow-wrap: anywhere; }
.location-group { margin-top: 16px; }
.location-group h3 { font-size: 14px; }
small, .hint { font-size: 14px; color: var(--muted); }
.hint { margin: 6px 0 0; }
label { display: block; font-size: 14px; font-weight: 680; margin: 10px 0 4px; }
a.action,button,input,textarea { font: inherit; }
button, a.action { display: inline-block; min-height: 44px; padding: 9px 13px; border: 0; border-radius: 10px; color: var(--onPrimary);
  background: linear-gradient(var(--primaryTop), var(--primaryBottom)); cursor: pointer; text-decoration: none; font-weight: 700; }
button.secondary { color: var(--ink); background: var(--back); }
button:disabled, a[aria-disabled="true"] { opacity: .56; cursor: default; }
input,textarea { width: 100%; border: 1px solid var(--progressTrack); border-radius: 8px; padding: 9px 10px; color: var(--ink); background: #fffaf6; }
textarea { resize: vertical; }
.connection-info button, .location-group button { margin-top: 8px; }
.actions { margin-top: 16px; }
.actions .action { display: block; text-align: center; }
summary { cursor: pointer; font-weight: 720; min-height: 28px; }
summary small { margin-left: 8px; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--progressIcon); outline-offset: 2px; }
[hidden] { display: none !important; }
.site-back { display:inline-block; margin-bottom:14px; color:var(--muted); font-size:.92rem; font-weight:650; text-underline-offset:.2em; }
</style>
</head>
<body>
<main>
  <a class="site-back" href="/">Voltar ao projeto</a>
  <header><h1>Apoio</h1><output id="connection" aria-live="polite">Sem conexão</output></header>
  <section class="connection-info" aria-label="Conexão com o aparelho">
    <p class="hint" id="help">Conecte o painel ao aparelho para receber pedidos.</p>
    <button id="ble" type="button" class="secondary">Conectar por Bluetooth</button>
  </section>
  <section id="waiting" hidden role="status">
    <h2>Aguardando um pedido</h2>
    <p class="hint">O rascunho aparece aqui quando é encaminhado pelo aparelho.</p>
  </section>
  <section id="inbox" hidden>
    <article>
      <h2 id="inbox-title">Revise a mensagem</h2>
      <div class="request-context" aria-live="polite">
        <h3 id="scenario"></h3><span class="hint" id="recipient"></span>
      </div>
      <label for="message">Texto da mensagem</label>
      <textarea id="message" rows="5" maxlength="1000"></textarea>
      <div class="location-group">
        <h3>Localização</h3>
        <p class="hint" id="location" role="status"></p>
        <button id="locate" type="button" class="secondary">Incluir localização atual</button>
      </div>
      <div class="actions">
        <a id="share" class="action" target="_blank" rel="noopener noreferrer">Abrir no WhatsApp</a>
        <p class="hint" id="share-hint">Confirme o envio no WhatsApp.</p>
      </div>
    </article>
  </section>
  <details id="setup">
    <summary>Contato de apoio <small id="saved-name"></small></summary>
    <form id="contact">
      <label for="name">Nome</label>
      <input id="name" type="text" maxlength="60" autocomplete="off">
      <label for="number">WhatsApp com DDD</label>
      <input id="number" type="tel" autocomplete="off" inputmode="tel" placeholder="DDD e número" maxlength="24">
      <div class="actions"><button>Salvar contato</button></div>
      <p class="hint" id="saved" role="status"></p>
    </form>
  </details>
</main>
<script>
"use strict";
const scenarios = [{"key":"ansiedade","title":"Ansiedade ou pânico","text":"Estou com muita ansiedade e preciso de apoio. Você pode falar comigo agora?"},{"key":"roubo","title":"Celular roubado","text":"Meu celular foi roubado. Preciso de ajuda. Pode avisar alguém de confiança e me ajudar a chegar a um lugar seguro?"},{"key":"risco","title":"Estou em risco","text":"Não me sinto em segurança. Preciso de ajuda agora. Pode avisar alguém de confiança?"},{"key":"conversa","title":"Preciso conversar","text":"Preciso conversar com alguém. Você pode me mandar uma mensagem quando puder?"},{"key":"urgente","title":"Mensagem pronta","text":"Preciso de ajuda agora. Pode tentar falar comigo ou avisar alguém de confiança?"}];
const format = {"opening":"Pedido de apoio","phoneLocation":"Minha localização atual pelo celular","deviceLocation":"Minha localização atual pelo GPS do aparelho","missingLocation":"Localização indisponível."};
const $ = id => document.getElementById(id);
const service = "24ee4220-5c42-4c90-a322-ec12904c6761";
const statusUuid = "24ee4221-5c42-4c90-a322-ec12904c6761";
const commandUuid = "24ee4222-5c42-4c90-a322-ec12904c6761";
const wifi = location.hostname === "192.168.4.1";
const canLocate = isSecureContext && Boolean(navigator.geolocation);
let contact = readContact();
let packetId = 0;
let recipient = null;
let coordinates = null;
let acknowledged = 0;
let acking = 0;
let bleTimer;
let busy = false;
let bleDevice, commands, status;
let ready = false;

function readContact() {
  try {
    const raw = localStorage.getItem("sos.trusted.v1");
    if (!raw) return null;
    const record = raw.startsWith("{") ? JSON.parse(raw) : {name: "Meu contato", number: raw};
    const number = normalizePhone(record.number || "");
    return number && record.name ? {name: record.name, number} : null;
  } catch { return null; }
}
function normalizePhone(input) {
  const digits = input.replace(/[\s()+.-]/g, "");
  if (/^\d{10,11}$/.test(digits)) return "55" + digits;
  return /^\d{12,15}$/.test(digits) ? digits : "";
}
function setConnection(text, instruction, connected) {
  if ($("connection").textContent !== text) $("connection").textContent = text;
  if ($("help").textContent !== instruction) $("help").textContent = instruction;
  $("connection").classList.toggle("ready", connected && Boolean(contact));
  $("connection").classList.toggle("pending", text === "Conectando");
  $("waiting").hidden = !connected || !contact || Boolean(packetId);
  ready = connected;
}
function panelConnected(channel) {
  const instruction = contact ? "Via " + channel + ". Mantenha o painel aberto para receber pedidos." :
    "Cadastre o contato que vai receber as mensagens.";
  setConnection(contact ? "Conectado" : "Falta o contato", instruction, true);
}
function updateContact() {
  $("name").value = contact?.name || "";
  $("number").value = contact?.number || "";
  $("saved-name").textContent = contact?.name || "";
}
updateContact();
$("setup").open = !contact;
$("contact").addEventListener("submit", event => {
  event.preventDefault();
  const name = $("name").value.trim();
  const number = normalizePhone($("number").value);
  if (!name || !number) { $("saved").textContent = "Preencha o nome e o número com DDD."; return; }
  contact = {name, number};
  try { localStorage.setItem("sos.trusted.v1", JSON.stringify(contact)); } catch {}
  updateContact();
  $("saved").textContent = "Contato salvo.";
  $("setup").open = false;
  sync();
});
function mapsLink() {
  if (!coordinates || Date.now() - coordinates.time > 60000) return "";
  return "https://maps.google.com/?q=" + coordinates.lat.toFixed(6) + "," + coordinates.lon.toFixed(6);
}
function updateMessage() {
  const link = mapsLink();
  const draft = $("message").value.trim();
  const location = link ? format.phoneLocation + "\n" + link : format.missingLocation;
  const text = [format.opening, draft, location].join("\n\n");
  if (recipient && draft) $("share").href = "https://wa.me/" + recipient.number + "?text=" + encodeURIComponent(text);
  else $("share").removeAttribute("href");
  $("share").setAttribute("aria-disabled", String(!draft));
  $("share-hint").textContent = draft ? "Confirme o envio no WhatsApp." : "Escreva uma mensagem para continuar.";
  if (!$("locate").disabled) {
    const note = link ? "Localização atual incluída · precisão de cerca de " + Math.round(coordinates.accuracy) + " m" :
      canLocate ? "Inclua a posição atual do celular, se quiser." : "A captura da posição do celular está disponível no painel HTTPS.";
    if ($("location").textContent !== note) $("location").textContent = note;
  }
}
$("message").addEventListener("input", updateMessage);
$("share").addEventListener("click", updateMessage);
$("locate").hidden = !canLocate;
$("locate").addEventListener("click", () => {
  const id = packetId;
  $("locate").disabled = true;
  $("location").textContent = "Buscando a localização atual do celular…";
  const finish = result => {
    $("locate").disabled = false;
    if (id !== packetId) return;
    coordinates = result;
    updateMessage();
    if (!result) $("location").textContent = "Localização indisponível. Você pode enviar a mensagem.";
  };
  navigator.geolocation.getCurrentPosition(position => {
    const {latitude, longitude, accuracy} = position.coords;
    if (Number.isFinite(latitude) && Number.isFinite(longitude) && Number.isFinite(accuracy) &&
        Math.abs(latitude) <= 90 && Math.abs(longitude) <= 180 && Date.now() - position.timestamp <= 15000) {
      finish({lat: latitude, lon: longitude, time: position.timestamp, accuracy});
    } else finish(null);
  }, () => finish(null), {enableHighAccuracy:true, maximumAge:0, timeout:7000});
});

async function receive(id, kind, acknowledge) {
  if (!id || !scenarios[kind - 1] || kind === 2 || !contact || document.visibilityState !== "visible") return;
  if (id !== packetId) {
    packetId = id;
    coordinates = null;
    recipient = {...contact};
    $("scenario").textContent = scenarios[kind - 1].title;
    $("recipient").textContent = "Para " + recipient.name;
    $("message").value = scenarios[kind - 1].text;
    $("waiting").hidden = true;
    $("inbox").hidden = false;
    updateMessage();
  }
  if (id === acknowledged || id === acking) return;
  acking = id;
  try { await acknowledge(id); acknowledged = id; }
  catch {}
  finally { if (acking === id) acking = 0; }
}
async function pollWifi() {
  const response = await fetch("/api/state?ready=" + Number(Boolean(contact)), {cache:"no-store",signal:AbortSignal.timeout(2400)});
  if (!response.ok) throw new Error("Wi-Fi indisponível");
  const packet = await response.json();
  panelConnected("Wi-Fi");
  await receive(packet.id, packet.kind, async id => {
    const ack = await fetch("/api/received?id=" + id, {method:"POST",signal:AbortSignal.timeout(2400)});
    if (!ack.ok) throw new Error("Pedido expirado");
  });
}
function bleIncoming(value) {
  if (!value || value.byteLength !== 5) return;
  return receive(value.getUint32(0, true), value.getUint8(4), id => {
    const buffer = new DataView(new ArrayBuffer(5));
    buffer.setUint8(0, 1);
    buffer.setUint32(1, id, true);
    return commands.writeValueWithResponse(buffer.buffer);
  });
}
async function pollBluetooth() {
  if (!bleDevice?.gatt.connected || !commands) return;
  await commands.writeValueWithResponse(Uint8Array.of(0, Number(Boolean(contact))));
  panelConnected("Bluetooth");
  await bleIncoming(await status.readValue());
}
async function sync() {
  if (busy || document.visibilityState !== "visible") return;
  busy = true;
  try {
    if (wifi) await pollWifi();
    else await pollBluetooth();
  } catch {
    setConnection("Sem conexão", "Confira a conexão com o aparelho.", false);
  } finally { busy = false; }
}
if (wifi) {
  $("ble").hidden = true;
  sync();
  setInterval(sync, 700);
} else if (navigator.bluetooth && isSecureContext) {
  $("help").textContent = "Escolha Projeto Senac ao conectar por Bluetooth.";
  $("ble").addEventListener("click", async () => {
    if (bleDevice?.gatt.connected) { bleDevice.gatt.disconnect(); return; }
    $("ble").disabled = true;
    setConnection("Conectando", "Selecione Projeto Senac para conectar o painel.", false);
    try {
      bleDevice = await navigator.bluetooth.requestDevice({filters:[{services:[service]}]});
      bleDevice.addEventListener("gattserverdisconnected", () => {
        clearInterval(bleTimer);
        commands = status = null;
        $("ble").textContent = "Conectar por Bluetooth";
        setConnection("Sem conexão", "Reconecte para receber novos pedidos.", false);
      }, {once:true});
      const gatt = await bleDevice.gatt.connect();
      const profile = await gatt.getPrimaryService(service);
      commands = await profile.getCharacteristic(commandUuid);
      status = await profile.getCharacteristic(statusUuid);
      await sync();
      if (!ready) throw new Error("Painel indisponível");
      $("ble").textContent = "Desconectar Bluetooth";
      bleTimer = setInterval(sync, 950);
    } catch {
      if (bleDevice?.gatt.connected) bleDevice.gatt.disconnect();
      setConnection("Sem conexão", "Confira o Bluetooth e tente novamente.", false);
    } finally { $("ble").disabled = false; }
  });
} else {
  $("ble").disabled = true;
  $("help").textContent = "Para usar por Wi-Fi, conecte à rede Apoio e abra http://192.168.4.1.";
}
document.addEventListener("visibilitychange", sync);
</script>
</body>
</html>
